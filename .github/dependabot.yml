version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Etc/UTC
  - package-ecosystem: docker
    directories:
      - /
      - /scripts/ci/fixture
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Etc/UTC
  - package-ecosystem: docker-compose
    directory: /scripts/ci
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Etc/UTC
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Etc/UTC
    groups:
      rust-dependencies:
        patterns: ['*']
