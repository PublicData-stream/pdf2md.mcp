[package]
name = "pdf2md-mcp"
version = "0.1.0"
edition = "2024"
default-run = "pdf2md-mcp"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "Operator-controlled PDF acquisition, history, and Markdown conversion"

[workspace]
members = ["crates/obscura-worker"]
default-members = ["."]
resolver = "3"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
httpdate = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
libc = "0.2"
notify = "8"
pdf_oxide = "=0.3.78"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "postgres", "any"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
toml = "0.8"
url = { version = "2", features = ["serde"] }
utoipa = "5"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
