[package]
name = "pdf2md-obscura-worker"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }

obscura-net = { git = "https://github.com/h4ckf0r0day/obscura", rev = "e3007167016b169bb58d8b5124ca9662a0b37f2d", features = ["stealth"] }
globset = "0.4"
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"
wreq = { version = "=6.0.0-rc.29", default-features = false }
httpdate = "1"
obscura-browser = { git = "https://github.com/h4ckf0r0day/obscura", rev = "e3007167016b169bb58d8b5124ca9662a0b37f2d", features = ["stealth"] }
