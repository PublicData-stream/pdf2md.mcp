[auth]
mode = "oauth2"

[auth.oidc]
issuer = "https://auth.example.com/realms/pdf2md"
audience = "https://pdf.example.com/"
validation = "introspection"
token_profile = "keycloak"
# A confidential client used only to introspect tokens. Keycloak introspects
# only tokens whose audience names this client; add it with an audience mapper.
client_id = "pdf2md-introspection"
client_secret = { env = "PDF2MD_OIDC_CLIENT_SECRET" }
read_scope = "pdf2md:read"
write_scope = "pdf2md:write"
operate_scope = "pdf2md:operate"

# Optional: authenticate introspection with a signed assertion
# (private_key_jwt, Keycloak's "Signed JWT" client authenticator) instead of
# client_secret.
# [auth.oidc.client_assertion]
# key = { file = "introspection-key.pem" }
# algorithm = "ES256"

# Optional: accept DPoP-bound access tokens (RFC 9449). Keycloak reports the
# binding in its JWTs and through introspection.
# [auth.oidc.dpop]
# public_url = "https://pdf.example.com"
# required = false

# API and MCP clients register their own application with the provider and
# obtain tokens there. Optional: browser sign-in for the bundled API console,
# with a separate public application. Register
# https://pdf.example.com/oauth/callback as a redirect URI.
[auth.client]
client_id = "pdf2md-web"
grant_types = ["authorization_code"]
scopes = ["pdf2md:read", "pdf2md:write"]
redirect_base_url = "https://pdf.example.com"

[http]
bind = "127.0.0.1:8080"
published_sources = []
