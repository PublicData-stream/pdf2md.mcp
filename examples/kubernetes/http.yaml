apiVersion: v1
kind: ConfigMap
metadata:
  name: pdf2md-http
  labels:
    app: pdf2md-http
data:
  config.toml: |
    [auth]
    mode = "none_ro"
    [http]
    published_sources = []
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pdf2md-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf2md-http
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pdf2md-http
  template:
    metadata:
      labels:
        app: pdf2md-http
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: pdf2md
          image: pdf2md-mcp:latest
          args: ["--data-dir", "/data", "--config", "/etc/pdf2md/config.toml", "serve", "--listen", "0.0.0.0:8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/pdf2md/config.toml, subPath: config.toml, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: pdf2md-data}
        - name: config
          configMap: {name: pdf2md-http}
---
apiVersion: v1
kind: Service
metadata:
  name: pdf2md-http
spec:
  selector:
    app: pdf2md-http
  ports:
    - {name: http, port: 80, targetPort: http}
